<!doctype html>
<!-- The centre screen's Settings, shown by LIVI as its custom page (customUrl = http://127.0.0.1:4010/).
     It only DRAWS clusterd's state: the dial goes to clusterd, never to this page, so keyboard focus inside
     LIVI's iframe does not matter. Round 720 x 720 panel: everything stays inside the inscribed circle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster settings</title>
<style>
  :root { --bg: #0e0e11; --fg: #faf4e8; --dim: #8c8c96; --accent: #e0884a; --row: #1c1c22; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font-family: system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #dial { position: absolute; inset: 0; margin: auto; width: min(100vw, 100vh); height: min(100vw, 100vh);
          border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 5vmin; letter-spacing: .3em; color: var(--accent); margin: 0 0 3vmin; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; width: 62%; }
  li { display: flex; justify-content: space-between; gap: 2vmin; padding: 1.6vmin 3vmin; margin: .8vmin 0;
       border-radius: 4vmin; font-size: 4.2vmin; background: transparent; transition: background .12s; }
  li .v { color: var(--dim); }
  li.sel { background: var(--row); }
  li.sel .v { color: var(--fg); }
  li.sel.edit { outline: .5vmin solid var(--accent); }
  li.sel.edit .v { color: var(--accent); }
  #hint { margin-top: 3vmin; font-size: 3vmin; color: var(--dim); text-align: center; max-width: 60%; }
  #home { display: none; font-size: 4vmin; color: var(--dim); }
</style>
</head>
<body>
<div id="dial">
  <h1>SETTINGS</h1>
  <ul id="rows"></ul>
  <div id="hint"></div>
  <div id="home">clusterd: not in Settings</div>
</div>
<script>
const rows = document.getElementById('rows'), hint = document.getElementById('hint'), home = document.getElementById('home');
function draw(s) {
  const inList = s.screen === 'settings';
  rows.style.display = hint.style.display = inList ? '' : 'none';
  home.style.display = inList ? 'none' : 'block';
  rows.replaceChildren(...s.rows.map(([label, value], i) => {
    const li = document.createElement('li');
    if (i === s.row) li.className = s.editing ? 'sel edit' : 'sel';
    const a = document.createElement('span'); a.textContent = label;
    const b = document.createElement('span'); b.className = 'v'; b.textContent = value;
    li.append(a, b);
    return li;
  }));
  hint.textContent = s.editing ? 'turn to change, click to keep, hold to cancel'
                               : 'turn to choose, click to change, hold to go back';
}
async function poll() {
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    if (r.ok) draw(await r.json());
  } catch (e) { /* clusterd restarting: keep the last picture */ }
  setTimeout(poll, 150);
}
poll();
</script>
</body>
</html>
