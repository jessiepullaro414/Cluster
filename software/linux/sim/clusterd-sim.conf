# clusterd on the PC bench, driven by car_sim.py (simulated GPIO and CAN). Same keys as deploy/clusterd.conf.example.
can_if = none
livi_port = 4000
page_port = 4010
# the dial: car_sim.py writes a 12-bit angle; 12 detents per turn (30 degrees each) so a mouse drag is not twitchy
dial_raw_min = 0
dial_raw_max = 4095
dial_detents = 12
# no real suspend on a PC: the key-off countdown only shows in the logs. Nothing sleeps, so clusterd tries again every
# 35 s or so while the key is off. The parked power-off stays off here; aa-bench/bench_park.py is what tests it.
suspend_cmd = echo clusterd: would suspend now
poweroff_cmd = echo clusterd: would power off now
parked_poweroff_hours = 0
